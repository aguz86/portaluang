<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#292524" stroke-width="8"/>
  
  <!-- Ambient Inner Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#292524" stroke-width="3" stroke-dasharray="10 10"/>
  <circle cx="256" cy="256" r="140" fill="url(#goldGrad)" opacity="0.08" filter="url(#glow)"/>

  <!-- Portal Uang Emblem -->
  <g transform="translate(256, 256)">
    <!-- The Portal -->
    <path d="M -70 100 L -70 -20 C -70 -75, 70 -75, 70 -20 L 70 100" fill="none" stroke="url(#glowGrad)" stroke-width="20" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M -70 100 L -70 -20 C -70 -75, 70 -75, 70 -20 L 70 100" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" />
    
    <!-- The Coin (Uang) floating inside -->
    <circle cx="0" cy="10" r="40" fill="url(#goldGrad)"/>
    
    <!-- Rp Symbol inside coin -->
    <text x="0" y="24" font-family="monospace" font-weight="900" font-size="36" fill="#78350f" text-anchor="middle">Rp</text>
    
    <!-- Sparkles / Stars -->
    <polygon points="60,-70 66,-55 81,-55 69,-45 74,-30 60,-40 46,-30 51,-45 39,-55 54,-55" fill="#fef08a" filter="url(#glow)"/>
    <polygon points="-75,10 -72,20 -62,20 -70,26 -67,36 -75,30 -83,36 -80,26 -88,20 -78,20" fill="#fef08a" filter="url(#glow)"/>
  </g>
</svg>
