<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#292524" stroke-width="8"/>
  
  <!-- Ambient Inner Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#292524" stroke-width="3" stroke-dasharray="10 10"/>
  <circle cx="256" cy="256" r="140" fill="url(#goldGrad)" opacity="0.08" filter="url(#glow)"/>

  <!-- Aura Dynamic Emblem (A Shape & Growth Chart) -->
  <g transform="translate(256, 256)">
    <!-- Shield / Mountain Apex -->
    <path d="M 0 -130 L 110 75 L 55 75 L 0 -35 L -55 75 L -110 75 Z" fill="url(#goldGrad)" />
    
    <!-- Ascending Growth Arc -->
    <path d="M -90 120 C -40 145, 40 145, 90 120 L 70 85 C 30 102, -30 102, -70 85 Z" fill="url(#cyanGrad)" />
    
    <!-- Sparkling Diamond Star -->
    <polygon points="0,-165 14,-135 44,-135 18,-115 28,-85 0,-105 -28,-85 -18,-115 -44,-135 -14,-135" fill="#fef08a" filter="url(#glow)"/>
    <circle cx="0" cy="18" r="16" fill="#fef08a"/>
  </g>
</svg>
